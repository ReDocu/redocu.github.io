- slug: duorbit
  kind: game
  order: 2
  title: DUORBIT
  card_title: DUORBIT · 트리플 모드 리듬 게임
  status: active
  tagline: 하나의 곡, 세 개의 문법.
  desc: 한 곡을 세 가지 방식으로 플레이하는 웹 브라우저 리듬 게임입니다. 두 노드가 서로를 공전하는 원버튼 오빗 모드, 4레인 낙하 노트의 폴 모드, 곡 중간에 두 방식이 실시간으로 바뀌는 스위치 모드를 10곡 × 난이도 3단계로 담았습니다. 채보는 음원 온셋 분석으로 자동 생성합니다.
  tags: [HTML5, Web Audio API, Vanilla JS, 리듬게임]
  thumb: /assets/thumbs/duorbit.webp
  screen_label: KEY.VISUAL
  screen_meta: WEB BROWSER · HTML5
  actions:
    - { label: 플레이, url: "https://eqmentstudio.itch.io/dourbit", primary: true }
    - { label: 기술문서, url: /projects/duorbit/tech/ }
    - { label: 개발 프로세스, url: /projects/duorbit/process/ }
  spec:
    PLATFORM: 웹 브라우저 (HTML5) · Windows 데스크톱
    STACK: Vanilla JS · Web Audio API · pygame
    MODES: 오빗 · 폴 · 스위치
    SONGS: 10곡 (4막) × 난이도 3단계
    STATUS:
    DEPLOY: itch.io
    SITE: eqmentstudio.itch.io/dourbit
  features_head: 같은 곡을 원버튼과 4레인 두 문법으로 치고, 마지막엔 둘을 섞어 칩니다.
  features:
    - { title: 각도가 곧 박자, desc: "오빗 모드는 두 노드가 서로를 공전하고, 길이 꺾이는 각도가 대기 박자가 됩니다(대기 박자 = 회전각 ÷ 180°)." }
    - { title: 실시간 모드 전환, desc: "스위치 모드는 곡 중간에 오빗과 폴이 번갈아 나옵니다. 막이 올라갈수록 전환 주기가 24마디에서 8마디로 짧아지고, 전환 직후엔 판정 창을 1.5배로 넓혀 줍니다." }
    - { title: 음원 분석 채보, desc: "온셋을 난이도별 그리드(8분·16분)에 스냅하고 강도 상위만 남겨 초당 2.2 / 3.4 / 5.2 노트로 밀도를 맞춥니다." }
    - { title: 겹치지 않는 경로, desc: "타일마다 공전 방향을 탐색으로 골라 오빗 경로가 자기 자신과 겹치지 않게 펼칩니다. 회전각(박자)은 그대로 두고 지형만 바꿉니다." }
    - { title: DSP 클록 판정, desc: "판정과 공전을 모두 AudioContext.currentTime 기준으로 계산하고, 첫 실행 캘리브레이션과 곡별 싱크 측정으로 기기 지연을 보정합니다." }
    - { title: AUTO 검증 모드, desc: "게임이 각 타일의 정확한 시각에 자동 입력해 전부 PERFECT로 플레이합니다. 판정 연출이 음악 비트에 얹히는지 귀로 확인하는 데 씁니다." }

