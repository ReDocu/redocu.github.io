  title: CharacterChat
  status: dev
  tagline: 내 PC의 AI와 나누는, 관계가 쌓이는 비주얼 노벨형 캐릭터 대화.
  desc: 브라우저에서 여는 비주얼 노벨 화면 위에서, 내 PC에서 돌아가는 로컬 LLM과 캐릭터 대화를 나눕니다. 캐릭터가 말할 때마다 LLM이 대사와 함께 포즈·배경·옷차림·호감도 변화를 직접 골라 화면에 반영하고, 대화가 쌓이면 관계가 "어색함"에서 "연인"까지 다섯 단계로 깊어집니다. 대화 데이터는 PC 밖으로 나가지 않습니다.
