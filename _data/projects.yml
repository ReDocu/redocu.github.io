    DEPLOY: Cloudflare Workers
  features_head: 다섯 역할(메이커·프리랜서·운영자·사업자·학습자)의 기록을 한 입력창, 한 화면으로 모읍니다.
  features:
    - { title: 캡처 한 곳 · 분류는 나중에, desc: "Ctrl+K 입력창이 URL·코드·날짜·시간·금액을 읽어 유형을 미리 보여 주고 Enter 한 번에 저장합니다. 인박스에서 9개 목적지로 1~2탭 이동." }
    - { title: 돈은 묻히지 않게, desc: "장애 → 미수금 → 정산 지연 → 만료 D-7 → 지난 마감 순으로 홈 상단에 고정. 해결될 때까지 사라지지 않습니다." }
    - { title: 같은 돈은 한 번만, desc: "고정비 자동 거래에 캡처·수동 입력·CSV를 결제일 ±3일·키워드·금액 ±5% 조건으로 병합합니다. 병합도 5초 되돌리기 대상." }
    - { title: 세금 방식이 미수금을 결정, desc: "발주처별 세금계산서 / 3.3% 원천징수 / 없음에 따라 청구액과 입금 분리가 달라집니다. 입금 1건이 장부 매출로 자동 연결." }
    - { title: 첨부 포함 ZIP 스트리밍, desc: "워커 메모리 한계 안에서 수백 MB 첨부를 내보내려고 무압축 ZIP 라이터를 직접 작성. 백업은 앱 키로 지울 수 없는 별도 버킷에 매일 쌓입니다." }
    - { title: 병렬 세션 구현, desc: "모듈별 파일 소유권을 정해 Claude Code 세션 4개가 병렬 구현. 모듈 간 계약을 함수 export로 고정하고 리드 세션만 커밋했습니다." }
  flow_head: PRD에서 배포까지 3일. 사용성 테스트에서 찾은 누락을 구현 전에 PRD로 되돌렸습니다.
  flow:
    - { key: PRD, title: PRD v0.5, desc: 5역할·하루 흐름 → 기능 ID 110여 개 → 데이터 모델 }
    - { key: REVIEW, title: 사용성 테스트, desc: 시나리오 9개 워크스루로 P0 누락 7건 발견 }
    - { key: DESIGN, title: 디자인, desc: 브루탈리즘 토큰 기준 화면 48장 }
    - { key: BUILD, title: Claude Code × 4, desc: 모듈별 소유권으로 병렬 구현, accent: true }
    - { key: DEPLOY, title: Workers · D1 · R2, desc: Cron 포함 무료 한도 안에서 운영 }
  screens:
    - { src: /projects/spm/img/home.png, caption: 홈 — 지금 봐야 할 것 · 오늘 · 이번 달 }
    - { src: /projects/spm/img/outsourcing.png, caption: 외주 — 정산대기 상시 노출 }
    - { src: /projects/spm/img/mobile-capture.png, caption: 모바일 캡처 /c — 고정비 병합 미리보기 }
    - { src: /projects/spm/img/common-ui.png, caption: 공통 UI — 토스트·빈 상태·토큰·단축키 }
    - { src: /projects/spm/screenshots/01-1-캡처-Ctrl+K-오버레이.png, caption: 캡처 — Ctrl+K 오버레이 }
